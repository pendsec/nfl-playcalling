# ── V3 — Scale and Transfer ─────────────────────────────────────────────────
# Scope (per CLAUDE.md): all 32 defenses pooled, all snaps (runs included),
# 2022-2024 train / 2025 held out. Two-level hierarchical action:
#   level 1 — personnel package x front (12), observed on every snap
#   level 2 — coverage shell x pressure (12), value estimated on dropbacks
# This file is the single source of truth for the V3 run: level 1 on every
# snap, then level 2 on charted dropbacks, the factored policy, and the V2 -> V3
# gate.

version: v3

data:
  source: nflfastR            # nflfastR | synthetic
  team: all                   # every defense pooled; `defteam` becomes a feature
  seasons: [2022, 2023, 2024, 2025]
  holdout_season: 2025        # time-aware split: train 2022-2024, test 2025
  down: all
  # Level 1 is observed on every snap, so runs stay in. Level 2 applies its own
  # dropback restriction (see action.level2) rather than filtering the dataset.
  play_types: [pass, run]
  use_ftn: true               # FTN supplies n_defense_box; 2022+ only
  ftn_min_coverage: 0.80
  cache_dir: data/raw

action:
  scheme: level1              # the treatment: personnel package x front
  level1:                     # pre-snap, every snap
    # Package by the number of defensive backs (CB + FS + SS + DB) on the field.
    # 2024 shares: base 24% (64% run), nickel 66% (40% run), dime+ 10% (14% run).
    personnel_packages:
      base: [0, 4]
      nickel: [5, 5]
      dime_plus: [6, 11]
    # FTN n_defense_box bucket edges: <=5 | 6 | 7 | >=8.
    front_bins: [5, 6, 7]
    # The axes that make up the call. The box count's effect is confounded by
    # the coordinator's read (heavy boxes face more runs than the state
    # predicts; packages do not), so it is guarded by policy.read_allowance.
    # `[package]` makes the call the package alone (3 actions, same snaps);
    # the allowance switches itself off and the AIPW baseline falls back to the
    # most common call.
    axes: [package, front]
  level2:                     # post-snap-measured; value estimated on charted dropbacks
    # family: Cover-0 / single-high / two-high (the safety structure) x pressure
    #   = 6 calls. full: the six charted shells x pressure = 12.
    # Family because the fine labels drift with the charting, not the defenses:
    # Cover-1's share rose at 30/32 teams 2022->24 (median +18.5 pts) and fell
    # at 32/32 in 2025 (-15.7). Family shares hold within ~4 pts across seasons.
    # On real data, full departs 3x as often (7.5%, mostly to Cover-1) for no
    # DR gain (-0.002 +/- 0.015 vs family -0.004 +/- 0.007).
    # Coverage off the taxonomy (uncharted, prevent, combo, blown) is dropped.
    shells: family
    blitz_rusher_threshold: 5

reward:
  negate_epa: true

features:
  # Offense-unit quality = the offense's own EPA/play, exponentially weighted
  # toward recent snaps. 250 plays (~4 games) best predicted next-game EPA on
  # 2022-24 (0.319 vs 0.284 for an unweighted history).
  offense_quality_halflife_plays: 250

# The V2 estimators, with team features added in Phase 1. Hyperparameters start
# from V2's and are revisited once the pooled data is ~70x larger.
behavior_model:
  type: lightgbm
  n_estimators: 300
  learning_rate: 0.05
  max_depth: 5
  min_child_samples: 30
  subsample: 0.8
  colsample_bytree: 0.8
  # isotonic (one-vs-rest) | none | temperature | vector | dirichlet. Joint
  # multiclass calibrators were tried (experiments/behavior_calibration/): no
  # gain on real data, where the miss is the call mix drifting between seasons.
  calibration: isotonic
  # Calibration folds hold out whole games: snap folds leave a snap's game-mates
  # in training, and the calibrator learns from optimistic predictions.
  calibration_groups: game    # play | game (game: -0.016 log loss on 2024, -0.006 on 2025)
  calibration_folds: 3
  cross_fit_folds: 3

outcome_model:
  type: lightgbm
  # One regressor over (state, package, front) rather than one per alignment:
  # shares strength across the 12 cells. Against a known SCM at this scale it
  # captured ~77% of the available policy gain vs ~45% for per-action models.
  structure: pooled
  n_estimators: 300
  learning_rate: 0.05
  max_depth: 5
  min_child_samples: 20
  subsample: 0.8
  colsample_bytree: 0.8
  min_cell: 20
  cross_fit_folds: 5
  ensemble:                   # game-bootstrap refits for the safe policy's bound
    n_boot: 20
  # Neural alternative (src/models/outcome/neural.py; needs torch). The factored
  # DragonNet ties this GBM on the real holdout's doubly-robust loss, but its
  # game-bootstrap spread is too tight for the safe policy (it departs ~2.5x as
  # often, -0.012 +/- 0.008 on 2025), so it is not the default; see
  # experiments/outcome_models/. To switch, add:
  #   type: dragonnet           # lightgbm (default) | tarnet | dragonnet
  #   neural:
  #     heads: factored         # factored (default) | separate
  #     hidden: [128, 64]       # the state representation phi(s)
  #     head_hidden: 32
  #     dropout: 0.1
  #     lr: 0.001
  #     weight_decay: 0.0001
  #     batch_size: 1024
  #     max_epochs: 60
  #     patience: 5             # early stopping on held-out games
  #     val_frac: 0.1
  #     alpha: 1.0              # DragonNet: weight of the propensity head
  #     beta: 1.0               # DragonNet: weight of targeted regularization
  #     embed_max: 8            # widest categorical embedding
  #     early_stop: loss        # loss | outcome (Q's error alone)
  # These are tuned values: a 48-config search kept the defaults (a flatter
  # net won on 2024 and lost it on 2025; experiments/dragonnet_tuning/).

policy:
  # safe: keep the coordinator's own mix unless a supported call's advantage over
  # it clears a lower confidence bound (bootstrap over games); see
  # src/policy/safe.py. conservative: deterministic argmax of Q + alpha*log pi_b.
  type: safe
  # One-sided 99% bound. Chosen on 2022-23 -> 2024 (never on 2025) from
  # {0, 0.5, 1, 1.645, 2.326}: the highest DR gain there (+0.0085/play).
  lcb_kappa: 2.326
  # The bootstrap bound sees sampling noise, not the read's bias. A box departure
  # must also clear `scale` x the box's estimated bias relative to the DC's mix
  # (excess runs faced x run-minus-pass reward, per box; src/policy/read_bias.py:
  # ~0.006-0.008 at <=5 and 8+, ~0 at 6). Scale chosen on 2022-23 -> 2024 from
  # {0, 1, 2, 3} with kappa held at 2.326: 2.0 (DR +0.0104 there).
  read_allowance:
    axes: [front]
    scale: 2.0
  level2:
    # The same 99% bound as level 1, NOT tuned on DR: on 2022-23 -> 2024 the
    # tuning rule picks kappa 0 (departs 95%, DR +0.073 vs DM +0.020). DR far
    # above DM is what the coordinator's read choosing the coverage and
    # improving the result produces (one season's noise can too); on the
    # confounded synthetic SCM DR reads +0.11 where the truth is -0.01 — so DR
    # on the tuning fold cannot choose it.
    lcb_kappa: 2.326
  alpha: 1.0                  # conservative policy only: units of Q's within-state spread
  support_threshold: 0.05

ope:
  clip_propensity: [0.01, 0.99]
  weight_clip: 20.0
  # The judge's pi_b (the holdout's DR/IPW weights), not the policy's:
  # pooled_crossfit = training seasons + the scored season's other games, season
  # in the state, folds by game — learns the scored season's call mix (calls,
  # never rewards). train = the policy's own train-fit pi_b. src/models/behavior/judge.py
  judge_propensity: pooled_crossfit
  judge_folds: 5
  aipw_baseline: nickel_box6  # the modal alignment (~39% of snaps); modal call if absent

sensitivity:
  gamma_range: [1.0, 1.5, 2.0, 3.0]

positivity:
  min_count: 10

scm:
  ci_tests: true              # test the graph's independence claims on training data
  confirm_on_holdout: true    # re-test the (train-revised) structure on 2025 — confirm, never revise

invariance:                   # src/evaluation/{invariance,transfer}.py; training seasons only
  environment: team_season    # 96 environments across 2022-2024
  crossfit_folds: 5           # nuisances out of fold by game, for every snap scored
  # The test: per component contrast (vs the most common component), Q's miss
  # on the snaps that took it minus its miss on the reference, per environment.
  # Null calibrated by permuting games across environments — the clustered SEs
  # understate the noise ~1.5-2x at ~17 games per environment.
  n_permutations: 500
  min_taken: 30               # an environment needs this many of each component
  alpha: 0.05                 # Bonferroni over the contrasts
  min_tau: 0.02               # the regression margin: smaller spreads are not acted on
  # Leave-one-team-out (32 refits) and leave-one-season-out (3): ~1 hour, so
  # off by default; `python run.py --config configs/v3.yaml --transfer`.
  run_transfer: false
  transfer_splits: [leave_one_team_out, leave_one_season_out]

evaluation:
  baseline_name: greedy_baseline
  candidate_name: safe_candidate
  regression_margin: 0.02
  # V2 -> V3 gate by projection into the joint (alignment x coverage) space on
  # SF's charted dropbacks in the holdout: V2's coverage policy (refit on
  # 2022-24, projected onto the level-2 calls) with the coordinator's alignment,
  # vs V3's factored policy; paired DR with V3's joint Q. V3 must not regress
  # on V2's own question. See src/evaluation/projection_gate.py.
  projection_gate:
    baseline_config: configs/v2.yaml
    team: SF

output_dir: outputs/v3         # keeps the level-1 run from overwriting outputs/

seed: 42

synthetic:
  n_plays: 9000
  seed: 7
